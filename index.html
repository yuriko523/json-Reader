<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JSON 阅读器</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
</head>
<body>
  <div id="app">

    <!-- ========== 顶部导航栏 ========== -->
    <nav id="nav-bar">
      <button id="back-btn" class="nav-icon-btn" aria-label="返回">‹</button>
      <span id="nav-title">JSON 阅读器</span>
      <div class="nav-right">
        <button id="menu-btn" class="nav-icon-btn" aria-label="菜单">☰</button>
        <button id="theme-btn" class="nav-icon-btn" aria-label="切换主题"></button>
      </div>
    </nav>

    <!-- ========== 导入页（空状态） ========== -->
    <section id="page-import" class="page active">
      <div class="empty-state">
        <div class="empty-icon">📂</div>
        <p class="empty-title">选择 JSON 文件</p>
        <p class="empty-desc">导入手机本地的聊天记录文件，以列表形式浏览</p>
        <button id="import-btn" class="primary-btn">选择文件</button>
        <input type="file" id="file-input" accept=".json" hidden>
      </div>
    </section>

    <!-- ========== 列表页 ========== -->
    <section id="page-list" class="page">
      <!-- 选项卡 -->
      <div id="tab-bar">
        <button class="tab-btn active" data-tab="all">📋 全部记录</button>
        <button class="tab-btn" data-tab="folders">📁 文件夹</button>
      </div>
      <div id="list-toolbar">
        <span id="list-count"></span>
        <div class="toolbar-actions">
          <button id="clear-btn" class="text-btn text-btn-danger">清空</button>
          <button id="reimport-btn" class="text-btn">重新选择</button>
        </div>
      </div>
      <div id="list-wrap"><!-- 动态填充 --></div>
      <div id="folder-wrap" style="display:none"><!-- 动态填充 --></div>
    </section>

    <!-- ========== 详情页 ========== -->
    <section id="page-detail" class="page">
      <div id="detail-wrap"><!-- 动态填充 --></div>
    </section>

    <!-- ========== 模态弹窗 ========== -->
    <div id="modal-overlay" class="modal-overlay">
      <div class="modal-dialog" id="modal-body"><!-- 动态填充 --></div>
    </div>

    <!-- ========== 设置面板（全屏抽屉） ========== -->
    <div id="settings-overlay" class="settings-overlay">
      <div class="settings-panel" id="settings-body"><!-- 动态填充 --></div>
    </div>

    <!-- ========== 一键回顶按钮 ========== -->
    <button id="scroll-top-btn" class="scroll-top-btn">⬆</button>

    <!-- ========== 荧光笔按钮 ========== -->
    <button id="hl-float-btn" class="hl-float-btn">🖍 荧光笔</button>

  </div>

  <!-- 隐藏文件输入（导入备份用） -->
  <input type="file" id="backup-input" accept=".json" hidden>

  <!-- Toast 消息 -->
  <div id="toast" class="toast" role="alert"></div>

  <script src="app.js"></script>
</body>
</html>
